services:
  db:
    image: mariadb:10.11
    container_name: seafile-db
    # MYSQL_LOG_CONSOLE=true routes mariadb logs to docker logs
    # (default writes to /var/lib/mysql/*.log, invisible to
    # `docker logs`). MARIADB_AUTO_UPGRADE runs mariadb-upgrade
    # automatically on major-version bump — one-liner insurance
    # against a manual step we'd otherwise forget in a year.
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_MYSQL_ROOT_PASSWORD:?SEAFILE_MYSQL_ROOT_PASSWORD env var is required — store in Bitwarden}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - seafile-net
    restart: unless-stopped

  memcached:
    image: memcached:1.6.18
    container_name: seafile-memcached
    # -m 256: cap memcached at 256 MB (default 64 MB is too tight
    # for library metadata caching once you've got real content).
    entrypoint: memcached -m 256
    networks:
      - seafile-net
    restart: unless-stopped

  seafile:
    image: seafileltd/seafile-mc:11.0-latest
    container_name: seafile
    # No `ports:` — cloudflared reaches this container by name
    # on my_network (`http://seafile:80`), no host port publish
    # needed. Public HTTPS is terminated by Cloudflare's edge.
    volumes:
      - ./data/seafile:/shared
    environment:
      - DB_HOST=db
      - DB_ROOT_PASSWD=${SEAFILE_MYSQL_ROOT_PASSWORD:?}
      - TIME_ZONE=Asia/Taipei
      # ADMIN_EMAIL + ADMIN_PASSWORD are ONLY consulted on first
      # boot to seed the initial admin account. Later runs ignore
      # them (Seafile has its own user DB). Keep them exported
      # because a from-scratch redeploy needs them again.
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL:?}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD:?}
      - SEAFILE_SERVER_HOSTNAME=seafile.930727fre.dev
      # HTTPS is terminated at Cloudflare's edge; Seafile itself
      # speaks HTTP to cloudflared. But URLs generated by Seafile
      # (share links, file previews, invite emails) MUST use https
      # or clients hit mixed-content errors.
      - SEAFILE_SERVER_PROTOCOL=https
      # We're behind cloudflared; skip Seafile's built-in Let's
      # Encrypt flow (which would try to bind :443 and fail).
      - SEAFILE_SERVER_LETSENCRYPT=false
    depends_on:
      - db
      - memcached
    networks:
      # seafile-net: internal-only comms with db + memcached (they
      # never need external reach). my_network: cloudflared reaches
      # the front here.
      - seafile-net
      - my_network
    restart: unless-stopped

networks:
  seafile-net:
  my_network:
    external: true
