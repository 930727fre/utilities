services:
  nextcloud:
    # Local build extends nextcloud:apache with libheif + ffmpeg for
    # HEIC/MOV thumbnail generation — see Dockerfile.
    build: .
    image: nextcloud-local:latest
    container_name: nextcloud
    # LAN-only exposure — no CF Tunnel route this time. Family uses
    # native app over LAN Wi-Fi (when at home) or Tailscale share
    # (when away, TBD). External web via CF is intentionally NOT
    # wired because Nextcloud's native apps break under CF Access
    # OTP redirect, and web-only browsing wasn't in the use case.
    #
    # Port 8082 — reuses filebrowser's old external port so any
    # bookmarks family had (http://<host-lan-ip>:8082) still point
    # somewhere useful (they'll see Nextcloud login instead of
    # filebrowser, but the URL didn't change).
    ports:
      - "8082:80"
    volumes:
      # Split by the two things Nextcloud recommends persisting:
      #   /var/www/html/config → config.php + config dir
      #   /var/www/html/data   → user files + SQLite DB + version
      #                          history + trash
      # Custom apps (bind /var/www/html/custom_apps) not persisted —
      # nobody's installing Nextcloud apps in this deployment.
      - ./data/config:/var/www/html/config
      - ./data/data:/var/www/html/data
    environment:
      # Bootstrap admin — consulted ONLY on first-run init. Later
      # changes go via web UI or `occ user:*` CLI. Keep exports around
      # for from-scratch redeploys (compose parse still needs them
      # since ${VAR:?...} is fail-loud).
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:?NEXTCLOUD_ADMIN_USER required — store in Bitwarden}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD required — store in Bitwarden}
      # SQLite mode — single container, no external DB needed. For 3
      # concurrent users this is fine; official docs recommend switching
      # to postgres/mysql past ~5 concurrent editors.
      - SQLITE_DATABASE=nextcloud
      # Nextcloud rejects requests whose Host header isn't whitelisted
      # (defense against Host-header spoofing). Space-separated list
      # of hostnames + IPs family will type into the app. Add your LAN
      # IP + hostname; Tailscale MagicDNS name gets added later when
      # that path is wired.
      #
      # `nextcloud` is prepended so container-to-container calls from
      # other my_network services (e.g. homelab/disk-watchdog reaching
      # http://nextcloud/) pass the Host-header check without extra
      # config. Only takes effect on FIRST init; existing installs need
      # `occ config:system:set trusted_domains 99 --value=nextcloud`.
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud ${NEXTCLOUD_TRUSTED_DOMAINS:?NEXTCLOUD_TRUSTED_DOMAINS required — space-separated hostnames/IPs, e.g. "192.168.1.100 tuf-3060-2404.local"}
    networks:
      # Attached even without CF Tunnel, so future disk-watchdog
      # integration (quota adjustments via occ) or CF re-wiring for
      # web-only browsing can happen without compose churn.
      - my_network
    restart: unless-stopped

networks:
  my_network:
    external: true
