services:
  xyt-app:
    build: .
    container_name: xyt-app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
    environment:
      - JOBS_FILE=/app/data/jobs.json
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY not exported in shell}
      - WHISPER_URL=http://whisper:8000
    restart: unless-stopped
    networks:
      - default
      - my_network

  xyt-frontend:
    build: ./frontend
    container_name: xyt-frontend
    environment:
      - BACKEND_URL=http://xyt-app:8000
    depends_on:
      - xyt-app
    restart: unless-stopped
    networks:
      - default
      - my_network

networks:
  my_network:
    external: true
