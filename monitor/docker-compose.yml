services:
  monitor:
    build: .
    container_name: monitor
    environment:
      # Both required — the alert path fails silently without them, and
      # a silent monitor is worse than none. Fail loud at compose parse
      # instead.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be exported before docker compose up}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID must be exported before docker compose up}
      # Percent-full threshold. Default 90 is the "actually dangerous"
      # line — 10% headroom on 1 TB = 100 GB, which is one big wrapper
      # away from ENOSPC. Below that, fill is user-managed via
      # rclone/restore.sh's own 90% preflight.
      - DISK_THRESHOLD_PCT=${DISK_THRESHOLD_PCT:-90}
      # Container-side tz so cron's timestamps match host expectations.
      # UTC is fine too — check-disk.sh uses `date -u` for the dedup
      # marker regardless.
      - TZ=Asia/Taipei
    volumes:
      # Read-only mount of homelab's data root. df sees this filesystem's
      # fill state — the container itself doesn't need write access.
      # create_host_path: false so a missing source path fails at
      # compose-up rather than docker auto-mkdiring an empty dir that
      # would forever report 0% used.
      - type: bind
        source: ../../homelab/data
        target: /data
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
