services:
  # ── Main API + Web UI ────────────────────────────────────────────
  # Handles auth, upload endpoints, web frontend, background workers
  # (all bundled in one image since Immich v1.100+). Native app + web
  # UI both hit port 2283 inside container; we publish 8082 on host
  # for LAN-direct access. No CF Tunnel — Immich native apps break
  # under CF Access OTP and family accepted "at-home upload + Tailscale
  # for outside" (Tailscale wiring is separate).
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ./data/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8082:2283"
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required — store in Bitwarden}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
      - REDIS_HOSTNAME=redis
      - TZ=Asia/Taipei
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      # default: internal comms with redis / postgres / ML worker.
      # my_network: reachable by external containers (future disk-watchdog
      # quota-freeze integration via container-name resolution).
      - default
      - my_network

  # ── Machine Learning worker (face + object detection, CLIP search) ─
  # Separate image so ML can scale independently. CUDA variant uses
  # the host's NVIDIA GPU (3060) — face embedding pass on 10k photos
  # drops from ~hours (CPU) to ~minutes. Falls back to CPU if GPU not
  # visible; you'll notice in initial scans if the drivers aren't wired.
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    volumes:
      - ./data/model-cache:/cache
    environment:
      - TZ=Asia/Taipei
    restart: unless-stopped
    # NVIDIA GPU passthrough. Requires host nvidia-docker runtime
    # (already installed for transcribe / whisper containers).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Redis (job queue + cache) ────────────────────────────────────
  # Immich uses Bull queue on top of Redis for background job
  # coordination (thumbnail gen, metadata extraction, ML tasks).
  # Ephemeral — no volume, no backup needed. Container restart =
  # fresh queue; any pending jobs re-enqueued from DB state.
  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  # ── Postgres (with pgvecto-rs for embedding vector search) ────────
  # Immich stores CLIP embeddings + face embeddings as pgvector columns.
  # tensorchord/pgvecto-rs is the Rust-based pgvector implementation
  # Immich pins to specific tag. Don't upgrade Postgres major without
  # checking Immich release notes — schema migration is tightly coupled.
  # Data path bind-mounted for backup + inspection; init flags match
  # Immich's official reference compose (data-checksums, shared preload).
  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: >-
        pg_isready --dbname='${DB_DATABASE_NAME:-immich}' --username='${DB_USERNAME:-postgres}' || exit 1;
        Chksum="$$(psql --dbname='${DB_DATABASE_NAME:-immich}' --username='${DB_USERNAME:-postgres}' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
        echo "checksum failure count is $$Chksum";
        [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    command: [
      "postgres",
      "-c", "shared_preload_libraries=vectors.so",
      "-c", "search_path=\"$$user\", public, vectors",
      "-c", "logging_collector=on",
      "-c", "max_wal_size=2GB",
      "-c", "shared_buffers=512MB",
      "-c", "wal_compression=on"
    ]
    restart: unless-stopped

networks:
  my_network:
    external: true
