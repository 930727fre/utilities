services:
  # ── Main API + Web UI ────────────────────────────────────────────
  # Handles auth, upload endpoints, web frontend, background workers
  # (all bundled in one image since Immich v1.100+). Native app + web
  # UI both hit port 2283 inside container; we publish 8082 on host
  # for LAN-direct access. No CF Tunnel — Immich native apps break
  # under CF Access OTP and family accepted "at-home upload + Tailscale
  # for outside" (Tailscale wiring is separate).
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ./data/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8082:2283"
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=${DB_USERNAME:-postgres}
      # Immich reads DB_PASSWORD internally (fixed name in Immich source);
      # shell-side we namespace as IMMICH_DB_PASSWORD to avoid collision
      # with any other service that also uses a plain DB_PASSWORD.
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:?IMMICH_DB_PASSWORD required — store in Bitwarden}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
      - REDIS_HOSTNAME=redis
      - TZ=Asia/Taipei
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      # default: internal comms with redis / postgres.
      # my_network: reachable by external containers (future disk-watchdog
      # quota-freeze integration via container-name resolution).
      - default
      - my_network

  # ── ML worker deliberately absent ─────────────────────────────────
  # No immich-machine-learning container: family use case is "photo
  # backup + basic browsing", not "search by face / object / natural
  # language". Skipping ML means:
  #   - no face recognition, object search, CLIP semantic search,
  #     duplicate detection, auto-tagging
  #   + no GPU / nvidia-persistenced socket dance
  #   + one fewer container, ~500-1000 MB less RAM idle
  #   + ~4 GB less disk (skipped model weight downloads)
  # Timeline / thumbnails / upload / album / EXIF search / map view
  # all still work — libvips inside immich-server handles all of that.
  #
  # After first boot, disable ML features in the admin UI so Immich
  # stops retrying the (absent) ML endpoint: Administration → Settings
  # → Machine Learning → toggle everything off. Otherwise logs get
  # spammed with "ML unreachable" errors.
  #
  # To re-enable later: add the immich-machine-learning service block
  # back (with `gpus: all` for CUDA acceleration if wanted), re-enable
  # in admin UI, ML pipeline picks up from scratch.

  # ── Redis (job queue + cache) ────────────────────────────────────
  # Immich uses Bull queue on top of Redis for background job
  # coordination (thumbnail gen, metadata extraction, ML tasks).
  # Ephemeral — no volume, no backup needed. Container restart =
  # fresh queue; any pending jobs re-enqueued from DB state.
  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  # ── Postgres (Immich's official bundle: VectorChord + pgvector) ───
  # Immich stores CLIP + face embeddings as vector columns. Migrated
  # from pgvecto-rs (`vectors` extension) to VectorChord (`vchord`)
  # around 2025 — this image bundles both vchord + pgvector and its
  # entrypoint wires the shared_preload_libraries / search_path
  # automatically so we don't hand-roll a `command:` block.
  #
  # Image tag pinned to what Immich's main-branch compose currently
  # recommends. When bumping Immich, cross-reference their reference
  # compose for postgres tag drift.
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      # Image ships its own healthcheck (checks pg_isready + Immich
      # schema readiness). `disable: false` uses that instead of
      # overriding, avoiding drift when the image updates its checks.
      disable: false
    restart: unless-stopped

networks:
  my_network:
    external: true
