services:
  live-hls:
    build: .
    container_name: live-hls
    ports:
      # 8765 to avoid 8000 clash with transcribe-app.
      - "8765:8000"
    volumes:
      # Mount transcribe's bt dir at /bt so the path strings transcribe
      # sends (e.g. "/bt/Wrapper/episode.mkv") resolve here without any
      # prefix translation. Read-only — we never need to write to it.
      - ../transcribe/data/bt:/bt:ro
    environment:
      - MEDIA_ROOTS=/bt
      - SESSION_IDLE_TIMEOUT=60
      - SESSION_DIR=/tmp/live-hls
      # NVIDIA runtime env (matches transcribe-app pattern).
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - default
      - my_network

networks:
  my_network:
    external: true
