services:
  webdav:
    image: hacdias/webdav:v5.8.0
    container_name: webdav
    restart: unless-stopped
    ports:
      - "8081:6065"
    volumes:
      # Password lives inside this config (plaintext). config.yaml is
      # .gitignore'd; bootstrap by copying config.example.yaml and editing.
      - ./config.yaml:/config.yaml:ro
      # Read-only mounts under a single /media scope: hacdias/webdav exposes
      # one directory as the root, so we collect the three sources here. Infuse
      # sees `bt/`, `yt/`, and `translate_zh/` as siblings. Read-only — Infuse
      # is for browsing and playback, not library management; deletes happen
      # via the transcribe UI or shell.
      - ../transcribe/data/bt:/media/bt:ro
      - ../transcribe/data/downloads:/media/yt:ro
      - ../transcribe/data/translate_zh:/media/translate_zh:ro
    networks:
      - my_network

networks:
  my_network:
    external: true
