services:
  webdav:
    image: hacdias/webdav:v5.8.0
    container_name: webdav
    restart: unless-stopped
    ports:
      - "8081:6065"
    volumes:
      # Password lives inside this config (plaintext). config.yaml is
      # .gitignore'd; bootstrap by copying config.example.yaml and editing.
      - ./config.yaml:/config.yaml:ro
      # Read-only mounts under a single /media scope: hacdias/webdav exposes
      # one directory as the root, so we collect the two sources here. Infuse
      # sees `bt/` and `yt/` as siblings. The bt-side Chinese sub sidecars
      # (`<stem>.zh-tw.srt`, produced by the "translate to zh" button) ride
      # along under `/media/bt/...` and Infuse picks them up as a separate
      # language track on the same video. Read-only — Infuse is for browsing
      # and playback, not library management; deletes happen via the
      # transcribe UI or shell.
      - ../transcribe/data/bt:/media/bt:ro
      - ../transcribe/data/downloads:/media/yt:ro
    networks:
      - my_network

networks:
  my_network:
    external: true
