services:
  transcribe-app:
    build: .
    container_name: transcribe-app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      # Single bind mount that exposes both bt/ (aria2 download dir,
      # raw torrent contents) and artifact/ (clean library, hardlinks of
      # main-feature videos + transcribe-produced SRTs). They MUST share
      # a mount so os.link() inside the container can hardlink between
      # them — Docker bind mounts each get their own st_dev, so two
      # separate ./data/bt:/bt + ./data/artifact:/artifact mounts would
      # fail with EXDEV (cross-device link) and silently fall back to a
      # full byte copy.
      - ./data:/app/data
    environment:
      - JOBS_FILE=/app/data/jobs.json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be exported before docker compose up}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be exported before docker compose up}
      - WHISPER_URL=http://whisper:8000
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:?OPENSUBTITLES_API_KEY must be exported before docker compose up}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME:?OPENSUBTITLES_USERNAME must be exported before docker compose up}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD:?OPENSUBTITLES_PASSWORD must be exported before docker compose up}
      # OS_MAX_TRIES: with a paid OpenSubtitles subscription that lifts
      # daily quota above the free-tier 20, set 3–5 to k-try the top-N
      # raw OS results per tier (download #1, WER, pass = done; else
      # #2, etc.). `:-1` keeps it optional; default 1 is single-slot
      # k-try.
      - OS_MAX_TRIES=${OS_MAX_TRIES:-1}
      # BT_PIPELINE_ENABLED: default 1 = normal (bt_filter LLM + hardlink,
      # whisper, annotation, everything). Set to 0 to make the container
      # a pure aria2 downloader — auto-loops go idle, downloads and
      # seeding still work, manual buttons (retry, translate-zh,
      # upgrade-english) still work. For a "download-only" period.
      - BT_PIPELINE_ENABLED=${BT_PIPELINE_ENABLED:-1}
      # aria2 subprocess sidecar (utilities/aria2/) — BT peer/tracker
      # traffic exits through Surfshark VPN over there; we only talk
      # REST via my_network. Override if the sidecar container name
      # differs.
      - ARIA2_URL=${ARIA2_URL:-http://aria2-gluetun:8080}
    restart: unless-stopped
    networks:
      - default
      - my_network

  transcribe-frontend:
    build: ./frontend
    container_name: transcribe-frontend
    environment:
      - BACKEND_URL=http://transcribe-app:8000
    depends_on:
      - transcribe-app
    restart: unless-stopped
    networks:
      - default
      - my_network

networks:
  my_network:
    external: true
