services:
  transcribe-app:
    build: .
    container_name: transcribe-app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      # /qb is the annotation library. transcribe spawns aria2c subprocesses
      # straight into here when the user submits a magnet via the qb tab —
      # no external qBittorrent service in the picture. Single source of
      # truth, no cp loop, no UI clicks to remember on a fresh machine.
      - ./data/library:/qb
    environment:
      - JOBS_FILE=/app/data/jobs.json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be exported before docker compose up}
      - WHISPER_URL=http://whisper:8000
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:?OPENSUBTITLES_API_KEY must be exported before docker compose up}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME:?OPENSUBTITLES_USERNAME must be exported before docker compose up}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD:?OPENSUBTITLES_PASSWORD must be exported before docker compose up}
    restart: unless-stopped
    networks:
      - default
      - my_network

  transcribe-frontend:
    build: ./frontend
    container_name: transcribe-frontend
    environment:
      - BACKEND_URL=http://transcribe-app:8000
    depends_on:
      - transcribe-app
    restart: unless-stopped
    networks:
      - default
      - my_network

networks:
  my_network:
    external: true
