services:
  transcribe-app:
    build: .
    container_name: transcribe-app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      # Single bind mount that exposes both bt/ (aria2 download dir,
      # raw torrent contents) and artifact/ (clean library, hardlinks of
      # main-feature videos + transcribe-produced SRTs). They MUST share
      # a mount so os.link() inside the container can hardlink between
      # them — Docker bind mounts each get their own st_dev, so two
      # separate ./data/bt:/bt + ./data/artifact:/artifact mounts would
      # fail with EXDEV (cross-device link) and silently fall back to a
      # full byte copy.
      - ./data:/app/data
    environment:
      - JOBS_FILE=/app/data/jobs.json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be exported before docker compose up}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be exported before docker compose up}
      - WHISPER_URL=http://whisper:8000
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:?OPENSUBTITLES_API_KEY must be exported before docker compose up}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME:?OPENSUBTITLES_USERNAME must be exported before docker compose up}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD:?OPENSUBTITLES_PASSWORD must be exported before docker compose up}
      # OS_MAX_TRIES: k-try the top-N raw OS results per tier (download
      # #1, WER, pass = done; else #2, etc.). 1 = single-slot k-try
      # (free-tier friendly, 20 downloads/day cap). 3–5 = paid-tier
      # setting; higher recall on rips with metadata pollution but
      # burns quota. Required (no default) — forgetting to set it
      # silently locked the pipeline to 1 across a whole Friends
      # rebuild, wasting quota and stamping .whisper-polluted on
      # episodes that would have salvaged with 3 tries. Fail loudly
      # at compose parse time instead.
      - OS_MAX_TRIES=${OS_MAX_TRIES:?OS_MAX_TRIES must be exported before docker compose up (integer string; 1 = free-tier single-shot, 3-5 = paid tier; `export OS_MAX_TRIES=3` or `="3"` both work)}
      # BT_PIPELINE_ENABLED: default 1 = normal (bt_filter LLM + hardlink,
      # whisper, annotation, everything). Set to 0 to make the container
      # a pure aria2 downloader — auto-loops go idle, downloads and
      # seeding still work, manual buttons (retry, translate-zh,
      # upgrade-english) still work. For a "download-only" period.
      - BT_PIPELINE_ENABLED=${BT_PIPELINE_ENABLED:-1}
      # aria2 subprocess sidecar (utilities/aria2/) — BT peer/tracker
      # traffic exits through Surfshark VPN over there; we only talk
      # REST via my_network. Override if the sidecar container name
      # differs.
      - ARIA2_URL=${ARIA2_URL:-http://aria2-gluetun:8080}
      # Telegram push notifications for pipeline lifecycle events.
      # Required: forgetting to export = notifier silently no-ops, which
      # is exactly the "silently breaks downstream" pattern the compose
      # :?required syntax exists for. Fail loud at compose parse time
      # so a stale shell without exports doesn't ship a container that
      # you *think* is notifying you.
      # Setup: message @BotFather /newbot to get the token, then hit
      # https://api.telegram.org/bot<TOKEN>/getUpdates after messaging
      # the bot once to find your chat_id. Export in shell before
      # `docker compose up` — the coding agent must never see these,
      # so they stay out of files.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be exported before docker compose up}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID must be exported before docker compose up}
    restart: unless-stopped
    networks:
      - default
      - my_network

  transcribe-frontend:
    build: ./frontend
    container_name: transcribe-frontend
    environment:
      - BACKEND_URL=http://transcribe-app:8000
    depends_on:
      - transcribe-app
    restart: unless-stopped
    networks:
      - default
      - my_network

networks:
  my_network:
    external: true
