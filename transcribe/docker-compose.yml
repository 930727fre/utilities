services:
  transcribe-app:
    build: .
    container_name: transcribe-app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      # /bt is the annotation library. Each magnet submitted via the bt tab
      # gets its own aria2c subprocess that writes a per-torrent wrapper
      # folder in here; transcribe's annotation loop then reads videos out
      # for whisper + Claude. Single bind mount, single source of truth.
      - ./data/bt:/bt
      # /translate_zh is the "fetch Chinese subs only" branch. User manually
      # mv's a watched-and-annotated folder in here; the scan loop queries
      # OpenSubtitles for zh-tw/zh-cn subs and saves them as
      # `<stem>.zh-tw.srt` next to the video. No whisper fallback.
      - ./data/translate_zh:/translate_zh
    environment:
      - JOBS_FILE=/app/data/jobs.json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be exported before docker compose up}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be exported before docker compose up}
      - WHISPER_URL=http://whisper:8000
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:?OPENSUBTITLES_API_KEY must be exported before docker compose up}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME:?OPENSUBTITLES_USERNAME must be exported before docker compose up}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD:?OPENSUBTITLES_PASSWORD must be exported before docker compose up}
    restart: unless-stopped
    networks:
      - default
      - my_network

  transcribe-frontend:
    build: ./frontend
    container_name: transcribe-frontend
    environment:
      - BACKEND_URL=http://transcribe-app:8000
    depends_on:
      - transcribe-app
    restart: unless-stopped
    networks:
      - default
      - my_network

networks:
  my_network:
    external: true
