services:
  backend:
    container_name: keyboard-backend
    build: ./backend
    environment:
      - WHISPER_URL=http://whisper:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY not exported in shell}
      - CORRECTIONS_PATH=/app/data/corrections.json
      - FRONTEND_DIR=/app/frontend
    volumes:
      - ./frontend:/app/frontend:ro
      - ./backend/data:/app/data
    networks:
      - my_network
    restart: unless-stopped

networks:
  my_network:
    external: true
