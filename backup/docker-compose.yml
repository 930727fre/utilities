services:
  backup:
    build: .
    container_name: backup
    # network_mode: host — rclone (used by restic's rclone: backend)
    # dials the friend's NAS over Tailscale. Docker's default bridge
    # netns can't see the host's tailscale0.
    network_mode: host
    volumes:
      # rclone.conf lives at ${HOME}/rclone.conf on the host — SHARED
      # with homelab/rclone. This container only uses the `[nas]`
      # (plain WebDAV) remote, not `[nas-crypt]`: restic does its own
      # encryption, layering rclone-crypt on top would be redundant
      # CPU for zero security gain.
      - type: bind
        source: ${HOME}/rclone.conf
        target: /config/rclone.conf
        read_only: true
        bind:
          create_host_path: false
      # Tool data mounts — must use the exact path /tools/<tool>/data
      # inside the container. create_host_path: false so a missing
      # source dies loudly at container-create instead of silently
      # backing up an empty tree.
      - type: bind
        source: ../flashcard/data
        target: /tools/flashcard/data
        bind:
          create_host_path: false
      - type: bind
        source: ../free2speak/data
        target: /tools/free2speak/data
        bind:
          create_host_path: false
      - type: bind
        source: ../../homelab/jellyfin/config
        target: /tools/jellyfin/data
        bind:
          create_host_path: false
      # Immich: bind mounts upload/ + postgres/ subtrees. postgres/
      # live data can't be safely raw-copied (WAL / mid-transaction
      # corruption risk), so backup.sh has an immich-specific
      # pg_dump pre-step that writes .sql into STAGING; the /postgres/
      # dir is excluded from the copy pass via COPY_EXCLUDE. Restore
      # requires manually `psql < immich-postgres.sql` after files land
      # (documented in README).
      - type: bind
        source: ../immich/data
        target: /tools/immich/data
        bind:
          create_host_path: false
      # crucial-docs: passive user-managed folder (certs, transcripts,
      # IDs, tax, etc.). No service writes here — files land manually
      # via `cp`, backup picks up the tree as-is. Lives under data/
      # inside this repo instead of at a top-level utilities/crucial-docs/
      # because it has no code / no container of its own — it's just a
      # folder that this pipeline reads from.
      - type: bind
        source: ./data/crucial-docs
        target: /tools/crucial-docs/data
        bind:
          create_host_path: false
      # secrets: pre-sealed monolithic blobs. Everything dropped here
      # is produced OFF-BOX and arrives already sealed — this container
      # never unseals or re-encrypts blobs, but it DOES generate a
      # par2 sidecar per blob (10% parity, single volume) for within-
      # tier rot detection + repair; see backup.sh "par2 sidecar
      # maintenance" section. Mounted at /secrets/ (not /tools/) because
      # it takes a different code path — plain rclone copy + par2, at
      # infinite retention, not restic.
      - type: bind
        source: ./data/secrets
        target: /secrets
        bind:
          create_host_path: false
    environment:
      # Space-separated tool list — must match /tools/<name>/data mount
      # names above. transcribe / homelab-data intentionally absent
      # (user manages those manually).
      - TOOLS=flashcard free2speak jellyfin immich crucial-docs
      - RCLONE_CONFIG=/config/rclone.conf
      # Immich's Postgres. backup.sh's immich case-branch pg_dumps to
      # STAGING before the file copy — needs to authenticate to postgres
      # via host loopback (Immich compose publishes 127.0.0.1:5433 for
      # this specific purpose, not exposed to LAN). Reuse the same
      # password already exported for Immich itself.
      - IMMICH_DB_PASSWORD=${IMMICH_DB_PASSWORD:-}
      # Two independent restic repos (both under the shared rclone.conf's
      # [nas] and [mega] remotes). Each is a separate keyspace, but the
      # SAME RESTIC_PASSWORD unlocks both — one keychain entry, two
      # storage locations. Both get the same daily backup pass.
      #
      # MEGA_EXCLUDE: tools to skip from the MEGA push. Currently immich —
      # its photo library is already 3-2-1 via phone + host + NAS, no
      # value in a fourth copy on MEGA free tier.
      #
      # Retention: every tool gets --keep-daily 90 --prune on both repos.
      # No exemptions — the "would cry if lost" bucket now lives in
      # backup/data/secrets/ (rclone copy + infinite retention),
      # which is the right primitive for pre-sealed monolithic blobs.
      # Everything backed up through this container is either recoverable
      # via other channels (immich → phone) or acceptable-to-lose-after-
      # 90-days (jellyfin watch state, flashcard scheduling, misc docs).
      - RESTIC_REPOSITORY_NAS=rclone:nas:restic/
      - RESTIC_REPOSITORY_MEGA=rclone:mega:restic/
      - MEGA_EXCLUDE=immich
      # LOSING THIS PASSWORD = LOSING ALL SNAPSHOTS on BOTH repos (restic
      # uses it as the master key for each repo's AES-256 encryption; no
      # recovery mechanism). Store in Bitwarden, export in shell before
      # compose up.
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:?RESTIC_PASSWORD env var is required — store plaintext in Bitwarden, losing it means all restic snapshots are unrecoverable}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN env var is required}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID env var is required}
    restart: unless-stopped
