services:
  backup:
    build: .
    container_name: backup
    # network_mode: host — rclone (used by restic's rclone: backend)
    # dials the friend's NAS over Tailscale. Docker's default bridge
    # netns can't see the host's tailscale0.
    network_mode: host
    volumes:
      # rclone.conf lives at ${HOME}/rclone.conf on the host — SHARED
      # with homelab/rclone. This container only uses the `[nas]`
      # (plain WebDAV) remote, not `[nas-crypt]`: restic does its own
      # encryption, layering rclone-crypt on top would be redundant
      # CPU for zero security gain.
      - type: bind
        source: ${HOME}/rclone.conf
        target: /config/rclone.conf
        read_only: true
        bind:
          create_host_path: false
      # Tool data mounts — must use the exact path /tools/<tool>/data
      # inside the container. create_host_path: false so a missing
      # source dies loudly at container-create instead of silently
      # backing up an empty tree.
      - type: bind
        source: ../flashcard/data
        target: /tools/flashcard/data
        bind:
          create_host_path: false
      - type: bind
        source: ../free2speak/data
        target: /tools/free2speak/data
        bind:
          create_host_path: false
      - type: bind
        source: ../marker-pipeline/data
        target: /tools/marker-pipeline/data
        bind:
          create_host_path: false
      - type: bind
        source: ../keyboard/backend/data
        target: /tools/keyboard/data
        bind:
          create_host_path: false
      - type: bind
        source: ../../homelab/jellyfin/config
        target: /tools/jellyfin/data
        bind:
          create_host_path: false
    environment:
      # Space-separated tool list — must match /tools/<name>/data mount
      # names above. transcribe / homelab-data intentionally absent
      # (user manages those manually).
      - TOOLS=flashcard free2speak jellyfin marker-pipeline keyboard
      - RCLONE_CONFIG=/config/rclone.conf
      # Restic repo lives at nas:restic/ (plain WebDAV path, restic
      # encrypts contents). rclone: prefix tells restic to use the
      # rclone binary as backend; nas: is the shared rclone.conf remote.
      - RESTIC_REPOSITORY=rclone:nas:restic/
      # LOSING THIS PASSWORD = LOSING ALL SNAPSHOTS (restic uses it as
      # the master key for the repo's AES-256 encryption; no recovery
      # mechanism). Store in Bitwarden, export in shell before compose up.
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:?RESTIC_PASSWORD env var is required — store plaintext in Bitwarden, losing it means all restic snapshots are unrecoverable}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN env var is required}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID env var is required}
    restart: unless-stopped
